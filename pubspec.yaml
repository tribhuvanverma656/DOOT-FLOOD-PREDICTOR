name: doot_flood_alert
description: "DOOT Flood Alert"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_blue_plus: ^1.32.10
  audioplayers: ^6.1.0
  flutter_tts: ^4.2.2
  url_launcher: ^6.3.1
  supabase_flutter: ^2.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/flash_flood.mp3
